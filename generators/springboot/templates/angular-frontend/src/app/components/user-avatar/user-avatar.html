@if (routerLink() !== null) {
  <!-- Clickable Avatar with Router Link -->
  <a
    [routerLink]="routerLink()"
    class="flex-shrink-0 rounded-full flex items-center justify-center font-semibold transition-colors"
    [class.w-6]="size() === 'xs'"
    [class.h-6]="size() === 'xs'"
    [class.text-xs]="size() === 'xs'"
    [class.w-8]="size() === 'sm'"
    [class.h-8]="size() === 'sm'"
    [class.text-sm]="size() === 'sm'"
    [class.w-10]="size() === 'md'"
    [class.h-10]="size() === 'md'"
    [class.text-base]="size() === 'md'"
    [class.w-16]="size() === 'lg'"
    [class.h-16]="size() === 'lg'"
    [class.text-xl]="size() === 'lg'"
    [class.w-24]="size() === 'xl'"
    [class.h-24]="size() === 'xl'"
    [class.text-2xl]="size() === 'xl'"
    [class.w-32]="size() === '2xl'"
    [class.h-32]="size() === '2xl'"
    [class.text-4xl]="size() === '2xl'"
    [class.bg-blue-600]="colorVariant() === 'primary'"
    [class.text-white]="colorVariant() === 'primary' || colorVariant() === 'secondary' || colorVariant() === 'gradient'"
    [class.hover:bg-blue-700]="colorVariant() === 'primary' && shouldShowHover()"
    [class.bg-indigo-600]="colorVariant() === 'secondary'"
    [class.hover:bg-indigo-700]="colorVariant() === 'secondary' && shouldShowHover()"
    [class.bg-white]="colorVariant() === 'white'"
    [class.text-indigo-600]="colorVariant() === 'white'"
    [class.bg-gradient-to-br]="colorVariant() === 'gradient'"
    [class.from-blue-500]="colorVariant() === 'gradient'"
    [class.to-blue-600]="colorVariant() === 'gradient'"
    [class.shadow-lg]="colorVariant() === 'white'"
    [attr.aria-label]="computedAriaLabel()"
  >
    {{ initials() }}
  </a>
} @else {
  <!-- Non-Clickable Avatar -->
  <div
    class="flex-shrink-0 rounded-full flex items-center justify-center font-semibold"
    [class.w-6]="size() === 'xs'"
    [class.h-6]="size() === 'xs'"
    [class.text-xs]="size() === 'xs'"
    [class.w-8]="size() === 'sm'"
    [class.h-8]="size() === 'sm'"
    [class.text-sm]="size() === 'sm'"
    [class.w-10]="size() === 'md'"
    [class.h-10]="size() === 'md'"
    [class.text-base]="size() === 'md'"
    [class.w-16]="size() === 'lg'"
    [class.h-16]="size() === 'lg'"
    [class.text-xl]="size() === 'lg'"
    [class.w-24]="size() === 'xl'"
    [class.h-24]="size() === 'xl'"
    [class.text-2xl]="size() === 'xl'"
    [class.w-32]="size() === '2xl'"
    [class.h-32]="size() === '2xl'"
    [class.text-4xl]="size() === '2xl'"
    [class.bg-blue-600]="colorVariant() === 'primary'"
    [class.text-white]="colorVariant() === 'primary' || colorVariant() === 'secondary' || colorVariant() === 'gradient'"
    [class.bg-indigo-600]="colorVariant() === 'secondary'"
    [class.bg-white]="colorVariant() === 'white'"
    [class.text-indigo-600]="colorVariant() === 'white'"
    [class.bg-gradient-to-br]="colorVariant() === 'gradient'"
    [class.from-blue-500]="colorVariant() === 'gradient'"
    [class.to-blue-600]="colorVariant() === 'gradient'"
    [class.shadow-lg]="colorVariant() === 'white'"
    [attr.aria-label]="computedAriaLabel()"
    role="img"
  >
    {{ initials() }}
  </div>
}
