name: Build
on:
  push:
    branches:
      - 'main'

jobs:
  progen:
    name: Build progen CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Print SDK Versions
        run: |
          java -version
          go version
          docker version

      # The SBGen packages are tested on macOS by the sbgen job: MyGo's text
      # engine needs GTK/Pango, which the Ubuntu runner does not have.
      - name: Test
        run: go test -v -short $(go list ./... | grep -v '/internal/sbgen/')

      - name: Build
        run: go build -v ./cmd/progen

  sbgen:
    name: Build SBGen desktop app
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet MyGo code
        run: |
          go tool mygo vet ./cmd/sbgen
          go tool mygo vet ./internal/sbgen/app

      # -short skips the test that generates a full project, which needs a JDK.
      - name: Test
        run: go test -short ./internal/sbgen/...

      - name: Build
        run: go tool mygo build -platform darwin/universal ./cmd/sbgen

      - uses: actions/upload-artifact@v7
        with:
          name: sbgen-darwin
          path: cmd/sbgen/build/
