name: Build
on:
  push:
    branches:
      - 'main'

jobs:
  progen:
    name: Build progen CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Print SDK Versions
        run: |
          java -version
          go version
          docker version

      # The Progen Desktop packages are tested on macOS by the desktop job: MyGo's text
      # engine needs GTK/Pango, which the Ubuntu runner does not have.
      - name: Test
        run: go test -v -short $(go list ./... | grep -v '/internal/desktop/')

      - name: Build
        run: go build -v ./cmd/progen

  desktop:
    name: Build Progen Desktop app
    runs-on: macos-latest
    needs: progen
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet MyGo code
        run: |
          go tool mygo vet ./cmd/desktop
          go tool mygo vet ./internal/desktop/app

      # -short skips the test that generates a full project, which needs a JDK.
      - name: Test
        run: go test -short ./internal/desktop/...

      - name: Build
        run: go tool mygo build -platform darwin/universal ./cmd/desktop

      - uses: actions/upload-artifact@v7
        with:
          name: progen-desktop-darwin
          path: cmd/desktop/build/

  desktop-cross:
    name: Build Progen Desktop for ${{ matrix.target }}
    # MyGo needs no cgo, so Ubuntu builds the Windows and Linux apps. Their tests
    # run on macOS, in the desktop job.
    runs-on: ubuntu-latest
    needs: progen
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-amd64, platform: windows/amd64 }
          - { target: linux-amd64, platform: linux/amd64 }
          - { target: linux-arm64, platform: linux/arm64 }
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Progen Desktop ships as an archive, without a Windows installer.
      - name: Build
        run: go tool mygo build -platform ${{ matrix.platform }} -skip-installer ./cmd/desktop

      - name: Package
        run: .github/scripts/package-desktop.sh ${{ matrix.target }} dist

      - uses: actions/upload-artifact@v7
        with:
          name: progen-desktop-${{ matrix.target }}
          path: dist/
