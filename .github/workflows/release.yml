name: Release
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # The CLI and Progen Desktop are released together, with the version of the tag.
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches internal/version
        run: |
          version=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/version/version.go)
          if [[ "${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Version ${version} in internal/version/version.go"
            exit 1
          fi

  goreleaser:
    name: progen CLI
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  # Progen Desktop is built for every platform, and uploaded only when every build
  # succeeds: a release has all of its desktop archives or none of them.
  desktop:
    name: Progen Desktop ${{ matrix.target }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { target: macos, os: macos-latest, platform: darwin/universal }
          # MyGo needs no cgo, so Ubuntu builds the Windows and Linux apps.
          - { target: windows-amd64, os: ubuntu-latest, platform: windows/amd64 }
          - { target: windows-arm64, os: ubuntu-latest, platform: windows/arm64 }
          - { target: linux-amd64, os: ubuntu-latest, platform: linux/amd64 }
          - { target: linux-arm64, os: ubuntu-latest, platform: linux/arm64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set the version from the tag
        working-directory: cmd/desktop
        run: |
          jq --arg version "${GITHUB_REF_NAME#v}" '.version = $version' mygo.json > mygo.json.tmp
          mv mygo.json.tmp mygo.json

      # Progen Desktop ships as an archive: no disk image, no Windows installer.
      - name: Build
        run: go tool mygo build -platform ${{ matrix.platform }} -skip-dmg -skip-installer ./cmd/desktop

      - name: Package
        run: .github/scripts/package-desktop.sh ${{ matrix.target }} dist

      - uses: actions/upload-artifact@v7
        with:
          name: progen-desktop-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  desktop-upload:
    name: Upload Progen Desktop
    # GoReleaser creates the GitHub release; Progen Desktop is uploaded to it.
    needs: [goreleaser, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: progen-desktop-*
          path: dist
          merge-multiple: true

      - name: Check every archive is there
        run: |
          for file in macos.zip windows-amd64.zip windows-arm64.zip linux-amd64.tar.gz linux-arm64.tar.gz; do
            test -f "dist/progen-desktop-${GITHUB_REF_NAME}-${file}" || { echo "missing progen-desktop-${GITHUB_REF_NAME}-${file}"; exit 1; }
          done

      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/progen-desktop-* \
            --repo "${GITHUB_REPOSITORY}" --clobber
