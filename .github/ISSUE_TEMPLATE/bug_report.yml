name: Bug report
description: Report a problem with the progen CLI, Progen Desktop, or a generated project
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search [existing issues](https://github.com/sivaprasadreddy/progen/issues) first to avoid duplicates.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Where did the problem happen?
      options:
        - progen CLI
        - Progen Desktop
        - Generated project (build, tests, or runtime)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Progen version
      description: Run `progen version`, or check the Progen Desktop release you downloaded.
      placeholder: v1.1.6
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows (x64)
        - Windows (ARM64)
        - Linux (x86-64)
        - Linux (ARM64)
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - Release download (GitHub Releases)
        - Homebrew
        - go install
        - Built from source
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `progen -c .progen.json`
        2. Run `./mvnw verify` in the generated project
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Project configuration
      description: |
        Paste your `.progen.json`, or list the options you chose (build tool, database, persistence, migration tool, frontend, features).
      render: json
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs and error output
      description: Paste relevant output. It will be formatted as code automatically.
      render: shell
    validations:
      required: false

  - type: input
    id: java
    attributes:
      label: Java version (for generated project issues)
      description: Output of `java -version`.
      placeholder: "25"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, Docker version, or anything else that helps.
    validations:
      required: false
