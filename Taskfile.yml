version: "3"

vars:
  MAIN_SRC_DIR: ./cmd/progen
  SBGEN_SRC_DIR: ./cmd/sbgen
  DIST_DIR: dist
  BINARY_NAME: progen
  GOARCHES: amd64 arm64

tasks:
  default:
    cmds:
      - task: test

  fmt:
    desc: Format Go source files
    cmds:
      - go fmt ./...

  build:
    desc: Compile binaries for macOS, Linux, Windows (amd64/arm64) into dist/
    deps: [ clean ]
    cmds:
      - |
        for arch in {{.GOARCHES}}; do
          echo "Building MacOS binary ($arch)"
          GOARCH=$arch GOOS=darwin go build -o {{.DIST_DIR}}/{{.BINARY_NAME}}-darwin-$arch {{.MAIN_SRC_DIR}}
          echo "Building Linux binary ($arch)"
          GOARCH=$arch GOOS=linux go build -o {{.DIST_DIR}}/{{.BINARY_NAME}}-linux-$arch {{.MAIN_SRC_DIR}}
          echo "Building Windows binary ($arch)"
          GOARCH=$arch GOOS=windows go build -o {{.DIST_DIR}}/{{.BINARY_NAME}}-windows-$arch.exe {{.MAIN_SRC_DIR}}
        done

  run:
    desc: Run interactively
    interactive: true
    cmds:
      - go run {{.MAIN_SRC_DIR}}

  sbgen_dev:
    desc: Run the SBGen desktop app, rebuilding as the code changes
    interactive: true
    cmds:
      - go tool mygo dev {{.SBGEN_SRC_DIR}}

  sbgen_build:
    desc: Build SBGen.app and a DMG into cmd/sbgen/build/ (pass e.g. -- -platform darwin/universal)
    cmds:
      - rm -rf {{.SBGEN_SRC_DIR}}/build
      - go tool mygo build {{.CLI_ARGS}} {{.SBGEN_SRC_DIR}}

  test:
    desc: Run tests in short mode (skips permutation tests)
    deps: [ fmt ]
    cmds:
      - echo "Run tests in short mode..."
      - go test -v -p 1 -short ./...

  all_tests:
    desc: Run all tests including slow integration tests
    cmds:
      - echo "Run all tests..."
      - go test -v -p 1 ./...

  clean:
    desc: Remove dist/ and the SBGen build output
    cmds:
      - echo "Cleaning..."
      - rm -rf {{.DIST_DIR}} {{.SBGEN_SRC_DIR}}/build
