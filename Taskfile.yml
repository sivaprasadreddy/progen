version: "3"

vars:
  MAIN_SRC_DIR: .
  DIST_DIR: dist
  BINARY_NAME: progen
  GOARCHES: amd64 arm64

tasks:
  default:
    cmds:
      - task: test

  fmt:
    desc: Format Go source files
    cmds:
      - go fmt ./...

  build:
    desc: Compile binaries for macOS, Linux, Windows (amd64/arm64) into dist/
    deps: [ clean ]
    cmds:
      - |
        for arch in {{.GOARCHES}}; do
          echo "Building MacOS binary ($arch)"
          GOARCH=$arch GOOS=darwin go build -o {{.DIST_DIR}}/{{.BINARY_NAME}}-darwin-$arch {{.MAIN_SRC_DIR}}
          echo "Building Linux binary ($arch)"
          GOARCH=$arch GOOS=linux go build -o {{.DIST_DIR}}/{{.BINARY_NAME}}-linux-$arch {{.MAIN_SRC_DIR}}
          echo "Building Windows binary ($arch)"
          GOARCH=$arch GOOS=windows go build -o {{.DIST_DIR}}/{{.BINARY_NAME}}-windows-$arch.exe {{.MAIN_SRC_DIR}}
        done

  run:
    desc: Run interactively
    interactive: true
    cmds:
      - go run main.go

  test:
    desc: Run tests in short mode (skips permutation tests)
    deps: [ fmt ]
    cmds:
      - echo "Run tests in short mode..."
      - go test -v -p 1 -short ./...

  all_tests:
    desc: Run all tests including slow integration tests
    cmds:
      - echo "Run all tests..."
      - go test -v -p 1 ./...

  clean:
    desc: Remove dist/ and local progen binary
    cmds:
      - echo "Cleaning..."
      - rm -rf {{.DIST_DIR}}
